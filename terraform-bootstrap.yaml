AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bootstrap infrastructure for Terraform state management'

Parameters:
  ProjectName:
    Type: String
    Default: 'ecs-refarch-batch-processing'
    Description: 'Name of the project (used for resource naming)'
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: [dev, staging, prod]
    Description: 'Environment name'

Resources:
  # S3 Bucket for Terraform state
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-terraform-state-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90

  # DynamoDB table for Terraform state locking
  TerraformStateLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-terraform-lock-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TerraformStateBucket:
    Description: 'S3 bucket for Terraform state'
    Value: !Ref TerraformStateBucket
    Export:
      Name: !Sub '${AWS::StackName}-terraform-state-bucket'

  TerraformStateLockTable:
    Description: 'DynamoDB table for Terraform state locking'
    Value: !Ref TerraformStateLockTable
    Export:
      Name: !Sub '${AWS::StackName}-terraform-lock-table'

  TerraformBackendConfig:
    Description: 'Terraform backend configuration'
    Value: !Sub |
      terraform {
        backend "s3" {
          bucket         = "${TerraformStateBucket}"
          key            = "terraform.tfstate"
          region         = "${AWS::Region}"
          dynamodb_table = "${TerraformStateLockTable}"
          encrypt        = true
        }
      }